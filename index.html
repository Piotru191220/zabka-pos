
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Żabka | Panel sklepu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f3;
            color: #222;
        }

        header {
            background: #009640;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .login-button {
            background: white;
            color: #009640;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 42px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">ŻABKA</div>
    <button class="login-button">Zaloguj się</button>
</header>

<main class="hero">
    <h1>Witamy w naszym sklepie!</h1>
    <p>Panel obsługi sklepu i system kasowy POS.</p>
</main>

<footer>
    © 2026 Żabka POS – projekt demonstracyjny
</footer>

</body>
</html>
