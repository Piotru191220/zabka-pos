
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symulator POS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4f6;
    color: #222;
}

header {
    background: #008b45;
    color: white;
    padding: 17px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h1 {
    margin: 0;
}

header button {
    background: white;
    color: #008b45;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 15px;
    cursor: pointer;
    font-weight: bold;
    background: #008b45;
    color: white;
}

button:hover {
    opacity: 0.85;
}

input {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.hidden {
    display: none !important;
}

#login {
    max-width: 360px;
    margin: 90px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #0002;
}

#login input {
    width: 100%;
    margin: 8px 0;
}

#login button {
    width: 100%;
    margin-top: 10px;
}

.demo-info {
    font-size: 12px;
    color: #666;
    text-align: center;
    margin-top: 15px;
}

main {
    padding: 20px;
}

.nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.nav button {
    background: #555;
}

.nav button.active {
    background: #008b45;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 20px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #0001;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 12px;
}

.product {
    background: #f5f7f5;
    color: #222;
    border: 1px solid #ddd;
    padding: 15px 8px;
    min-height: 125px;
}

.product span {
    display: block;
    font-size: 30px;
    margin-bottom: 8px;
}

.product strong {
    display: block;
    margin: 5px 0;
}

.scanner {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.scanner input {
    flex: 1;
    min-width: 0;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.remove {
    background: #d93636;
    padding: 6px 10px;
}

.total {
    font-size: 23px;
    font-weight: bold;
    margin: 20px 0;
}

.pay-buttons {
    display: flex;
    gap: 8px;
}

.pay-buttons button {
    flex: 1;
}

.cancel {
    background: #d93636;
    width: 100%;
    margin-top: 10px;
}

#message {
    color: #008b45;
    font-weight: bold;
}

#receiptWindow {
    display: none;
    background: white;
    border: 1px dashed #777;
    padding: 20px;
    margin-top: 20px;
    font-family: monospace;
}

.receipt-title {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

.receipt-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 8px 0;
}

.receipt-total {
    font-size: 18px;
    font-weight: bold;
    border-top: 1px dashed black;
    padding-top: 10px;
}

.receipt-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.receipt-close {
    background: #555;
}

.history-item {
    background: #f5f7f5;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
}

.history-item button {
    margin-top: 10px;
}

.history-details {
    margin-top: 10px;
    padding: 10px;
    background: white;
    border-radius: 7px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 30px;
}

@media(max-width: 800px) {
    .layout {
        grid-template-columns: 1fr;
    }
}

@media print {
    body * {
        visibility: hidden;
    }

    #receiptWindow,
    #receiptWindow * {
        visibility: visible;
    }

    #receiptWindow {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: none;
    }

    .receipt-actions {
        display: none !important;
    }
}
</style>
</head>

<body>

<header>
    <h1>ŻABKA | SYMULATOR POS</h1>
    <button id="logoutButton" class="hidden" onclick="logout()">WYLOGUJ</button>
</header>

<section id="login">
    <h2>Logowanie pracownika</h2>

    <input id="username" placeholder="Login">
    <input id="password" type="password" placeholder="Hasło">

    <button onclick="login()">ZALOGUJ SIĘ</button>

    <p id="loginMessage"></p>

    <div class="demo-info">
        Wersja demonstracyjna.<br>
        Login: pracownik<br>
        Hasło: 1234
    </div>
</section>

<main id="app" class="hidden">

    <div class="nav">
        <button id="posTab" class="active" onclick="showPage('pos')">
            KASA
        </button>

        <button id="historyTab" onclick="showPage('history')">
            HISTORIA SPRZEDAŻY
        </button>
    </div>

    <section id="posPage">

        <div class="layout">

            <div class="panel">
                <h2>Produkty</h2>

                <div class="scanner">
                    <input
                        id="barcode"
                        placeholder="Zeskanuj kod kreskowy..."
                        onkeydown="if(event.key === 'Enter') scanProduct()"
                    >

                    <button onclick="scanProduct()">SKANUJ</button>
                </div>

                <div class="products" id="products"></div>
            </div>

            <div class="panel">
                <h2>Koszyk</h2>

                <div id="cart"></div>

                <div class="total">
                    SUMA: <span id="total">0,00</span> zł
                </div>

                <div class="pay-buttons">
                    <button onclick="pay('Gotówka')">GOTÓWKA</button>
                    <button onclick="pay('Karta')">KARTA</button>
                </div>

                <button class="cancel" onclick="clearCart()">
                    ANULUJ SPRZEDAŻ
                </button>

                <p id="message"></p>

                <div id="receiptWindow">
                    <div id="receiptContent"></div>

                    <div class="receipt-actions">
                        <button onclick="window.print()">DRUKUJ PARAGON</button>
                        <button class="receipt-close" onclick="closeReceipt()">
                            ZAMKNIJ
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <section id="historyPage" class="hidden">
        <div class="panel">
            <h2>Historia sprzedaży</h2>

            <p>
                Liczba transakcji:
                <strong id="historyCount">0</strong>
            </p>

            <p>
                Łączna wartość sprzedaży:
                <strong id="historyTotal">0,00 zł</strong>
            </p>

            <hr>

            <div id="historyList"></div>
        </div>
    </section>

</main>

<script>
const products = [
    {name: "Woda", price: 2.99, barcode: "590001", emoji: "💧"},
    {name: "Cola", price: 5.99, barcode: "590002", emoji: "🥤"},
    {name: "Kawa", price: 7.99, barcode: "590003", emoji: "☕"},
    {name: "Hot Dog", price: 8.99, barcode: "590004", emoji: "🌭"},
    {name: "Chipsy", price: 6.49, barcode: "590005", emoji: "🍟"},
    {name: "Kanapka", price: 9.99, barcode: "590006", emoji: "🥪"},
    {name: "Czekolada", price: 4.99, barcode: "590007", emoji: "🍫"},
    {name: "Sok", price: 4.49, barcode: "590008", emoji: "🧃"},
    {name: "Drożdżówka", price: 5.49, barcode: "590009", emoji: "🥐"}
];

let cart = [];
let history = [];
let receiptNumber = 1;

function money(value) {
    return value.toFixed(2).replace(".", ",");
}

function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "pracownik" && password === "1234") {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        document.getElementById("logoutButton").classList.remove("hidden");

        renderProducts();
        renderCart();
    } else {
        document.getElementById("loginMessage").textContent =
            "Nieprawidłowy login lub hasło!";
    }
}

function logout() {
    cart = [];

    document.getElementById("app").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("logoutButton").classList.add("hidden");

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("barcode").value = "";

    closeReceipt();
    renderCart();
}

function renderProducts() {
    const container = document.getElementById("products");
    container.innerHTML = "";

    products.forEach(product => {
        const button = document.createElement("button");
        button.className = "product";

        button.innerHTML = `
            <span>${product.emoji}</span>
            <strong>${product.name}</strong>
            ${money(product.price)} zł
        `;

        button.onclick = () => addProduct(product);
        container.appendChild(button);
    });
}

function addProduct(product) {
    cart.push({...product});
    renderCart();

    document.getElementById("message").textContent =
        "Dodano: " + product.name;
}

function scanProduct() {
    const code = document.getElementById("barcode").value.trim();

    const product = products.find(p => p.barcode === code);

    if (product) {
        addProduct(product);
        document.getElementById("barcode").value = "";
    } else {
        document.getElementById("message").textContent =
            "Nie znaleziono produktu!";
    }
}

function removeProduct(index) {
    cart.splice(index, 1);
    renderCart();
}

function renderCart() {
    const container = document.getElementById("cart");
    container.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = '<p class="empty">Koszyk jest pusty</p>';
    }

    cart.forEach((product, index) => {
        total += product.price;

        const item = document.createElement("div");
        item.className = "cart-item";

        const name = document.createElement("span");
        name.textContent = product.name + " – " + money(product.price) + " zł";

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.textContent = "X";
        remove.onclick = () => removeProduct(index);

        item.appendChild(name);
        item.appendChild(remove);

        container.appendChild(item);
    });

    document.getElementById("total").textContent = money(total);
}

function clearCart() {
    cart = [];
    renderCart();

    document.getElementById("message").textContent =
        "Sprzedaż anulowana.";
}

function pay(method) {
    if (cart.length === 0) {
        document.getElementById("message").textContent =
            "Koszyk jest pusty!";
        return;
    }

    const soldItems = cart.map(item => ({...item}));

    const total = soldItems.reduce(
        (sum, item) => sum + item.price, 0
    );

    const now = new Date();

    const transaction = {
        number: receiptNumber,
        date: now.toLocaleDateString("pl-PL"),
        time: now.toLocaleTimeString("pl-PL"),
        method: method,
        items: soldItems,
        total: total
    };

    history.unshift(transaction);

    showReceipt(transaction);

    receiptNumber++;

    cart = [];
    renderCart();

    document.getElementById("message").textContent =
        "Płatność zakończona pomyślnie!";
}

function showReceipt(transaction) {
    const content = document.getElementById("receiptContent");

    let html = `
        <div class="receipt-title">SYMULATOR POS</div>
        <p style="text-align:center">PARAGON DEMONSTRACYJNY</p>
        <hr>
        Numer: ${transaction.number}<br>
        Data: ${transaction.date}<br>
        Godzina: ${transaction.time}<br>
        Stanowisko: 1
        <hr>
    `;

    transaction.items.forEach(item => {
        html += `
            <div class="receipt-line">
                <span>${item.name}</span>
                <span>${money(item.price)} zł</span>
            </div>
        `;
    });

    html += `
        <hr>
        <div class="receipt-total">
            RAZEM: ${money(transaction.total)} zł
        </div>
        <p>Płatność: ${transaction.method}</p>
        <hr>
        <p style="text-align:center">
            DZIĘKUJEMY ZA ZAKUPY!
        </p>
        <p style="text-align:center;font-size:12px">
            To nie jest dokument fiskalny.
        </p>
    `;

    content.innerHTML = html;

    document.getElementById("receiptWindow").style.display = "block";
}

function closeReceipt() {
    document.getElementById("receiptWindow").style.display = "none";
}

function showPage(page) {
    const isPos = page === "pos";

    document.getElementById("posPage").classList.toggle("hidden", !isPos);
    document.getElementById("historyPage").classList.toggle("hidden", isPos);

    document.getElementById("posTab").classList.toggle("active", isPos);
    document.getElementById("historyTab").classList.toggle("active", !isPos);

    if (!isPos) {
        renderHistory();
    }
}

function renderHistory() {
    const container = document.getElementById("historyList");
    container.innerHTML = "";

    document.getElementById("historyCount").textContent = history.length;

    const totalSales = history.reduce(
        (sum, transaction) => sum + transaction.total, 0
    );

    document.getElementById("historyTotal").textContent =
        money(totalSales) + " zł";

    if (history.length === 0) {
        container.innerHTML =
            '<div class="empty">Nie ma jeszcze żadnych transakcji.</div>';
        return;
    }

    history.forEach((transaction, index) => {
        const item = document.createElement("div");
        item.className = "history-item";

        const heading = document.createElement("strong");
        heading.textContent = "Transakcja #" + transaction.number;

        const info = document.createElement("p");
        info.textContent =
            transaction.date + " | " + transaction.time +
            " | " + transaction.method;

        const amount = document.createElement("p");
        amount.textContent = "Kwota: " + money(transaction.total) + " zł";

        const detailsButton = document.createElement("button");
        detailsButton.textContent = "SZCZEGÓŁY";

        const details = document.createElement("div");
        details.className = "history-details hidden";

        transaction.items.forEach(product => {
            const line = document.createElement("p");
            line.textContent =
                product.name + " – " + money(product.price) + " zł";
            details.appendChild(line);
        });

        detailsButton.onclick = () => {
            details.classList.toggle("hidden");
            detailsButton.textContent = details.classList.contains("hidden")
                ? "SZCZEGÓŁY"
                : "UKRYJ SZCZEGÓŁY";
        };

        item.appendChild(heading);
        item.appendChild(info);
        item.appendChild(amount);
        item.appendChild(detailsButton);
        item.appendChild(details);

        container.appendChild(item);
    });
}
</script>

</body>
</html>
